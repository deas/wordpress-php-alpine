;; So we play with /var/run/mysqld:/var/run/mysqld mounted in
mysqli.default_socket=/var/run/mysqld/mysqld.sock

;; TODO: STOPGAP for php2shell (CVE-2026-109618 / CVE-2026-109619), added 2026-10-21
;; while PHP's fix was still embargoed. REMOVE once the FROM base carries the
;; patched PHP — it is a workaround, not part of the image's design.
;;
;; The leaked root cause, unconfirmed by PHP, is a use-after-free in the session
;; upload-progress callback (php_session_rfc1867_callback). That callback runs
;; on any multipart POST naming PHP_SESSION_UPLOAD_PROGRESS, whether or not the
;; site ever asked for a progress bar. It costs WordPress nothing: core uses
;; neither PHP sessions nor upload progress, and uploads themselves still work.
;;
;; This closes AT MOST ONE of the two bugs. The other is reported to be in the
;; multipart parser, which runs regardless of this setting. Only the patched PHP
;; closes both — do not read this line as "mitigated".
session.upload_progress.enabled=Off
