name: test

on:
  # Deliberately UNFILTERED. release.yml only runs on push to main, so on a pull
  # request this workflow is the entire signal — it should not be possible to
  # open a PR that skips it.
  pull_request:

  push:
    branches:
      - 'main'
    # DELIBERATELY SHORT, and not the list of "things that affect the test
    # result" — Dockerfile, entrypoint.sh and the other files baked into the
    # image are missing ON PURPOSE. release.yml now builds, runs this same
    # suite against what it built, and only pushes if it is green, so on main
    # those paths are already covered; naming them here just builds and tests
    # amd64 a second time on the same commit.
    #
    # What is left is the complement: files that change the test result but
    # never reach the image, so release.yml has no reason to care about them.
    # test/** is here because otherwise a broken suite could be merged without
    # ever having run.
    #
    # Before re-adding Dockerfile: PRs already cover it via the unfiltered
    # trigger above, and main covers it via release.yml.
    paths:
      - 'Makefile'
      - 'test/**'
      - '.github/workflows/test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bats-support and bats-assert are vendored in test/lib, so only bats
      # itself is installed here. `parallel` is what bats --jobs needs.
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats parallel

      # Cached, unlike `make docker-build`'s --no-cache: CI wants the fast path,
      # and release.yml is what builds the artefact that actually ships.
      - name: Build image
        run: docker build -t deas/wordpress:ci .

      # Fast suites first, so a missing extension or a broken xdebug toggle
      # fails in ~30s rather than after a database and a WordPress download.
      - name: Test — image, xdebug, entrypoint
        run: IMAGE=deas/wordpress:ci SKIP_INTEGRATION=1 bats --jobs 4 --formatter tap test/

      - name: Test — integration (installs WordPress against MariaDB)
        run: IMAGE=deas/wordpress:ci bats --formatter tap test/40-integration.bats
